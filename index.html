const API_URL = 'https://script.google.com/macros/s/AKfycbwkEj1CPlheul2kdue8AxLrIrnXybQJhV85xIC09ki49Z3qnumJlC5fWlNV0wTe9_ZSgg/exec';

const call = async (fn, ...args) => {
  let payload = {};
  if (fn === 'login') {
    payload = { action: 'login', user: args[0], pass: args[1] };
  } else if (fn === 'api') {
    payload = { action: 'api', token: args[0], method: args[1], params: args[2] || {} };
  }

  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 90000);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctl.signal,
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('Server mengembalikan status ' + res.status);
    let r;
    try { r = await res.json(); }
    catch (e) { throw new Error('Respons server tidak valid. Pastikan Web App di-deploy dengan akses "Anyone".'); }
    if (r && r.ok) return r.data;
    throw new Error(r ? r.msg : 'Respons kosong dari server');
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Waktu habis, periksa koneksi lalu coba lagi');
    if (e instanceof TypeError) throw new Error('Gagal terhubung ke server. Periksa URL Web App & koneksi internet.');
    throw e;
  } finally {
    clearTimeout(t);
  }
};

  try {
    // Menggunakan text/plain agar tidak terkena blokir CORS preflight browser
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    
    const r = await res.json();
    if (r && r.ok) return r.data;
    throw new Error(r ? r.msg : 'Error dari server');
  } catch (err) {
    throw new Error(err.message || 'Gagal terhubung ke server');
  }
};

function setF(id,v,src){const el=$(id);if(!el)return false;const a=el.dataset.auto;
 if(el.value&&!(a&&(a===src||(a==='nota'&&src==='resi'))))return false;

async function prepOcr(f){            // PDF apa adanya (maks 2 MB); gambar: diperbesar bila kecil, abu-abu + kontras, dikompres <2 MB agar OCR lebih akurat
 if(f.type==='application/pdf'){if(f.size>1.9*1048576)throw new Error('PDF lebih dari 2 MB tidak bisa dibaca OCR. Kompres PDF, unggah sebagai foto, atau isi manual.');return readF(f)}
 if(!/^image\//.test(f.type))throw new Error('OCR hanya mendukung JPG, PNG, atau PDF');
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Gambar tidak bisa dibuka (format HEIC belum didukung browser)'));i.src=URL.createObjectURL(f)});
 const mx=Math.max(img.width,img.height);let sc=mx<1600?Math.min(3,1800/mx):Math.min(1,2200/mx),q=.92,b64='';
 for(let n=0;n<6;n++){const c=document.createElement('canvas'),x=c.getContext('2d'),pd=Math.round(Math.max(40,Math.min(img.width,img.height)*sc*.15)),iw=Math.round(img.width*sc),ih=Math.round(img.height*sc);c.width=iw+2*pd;c.height=ih+2*pd;   // margin putih: potongan sempit (1 baris barang) lebih mudah dibaca OCR
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';try{x.filter='grayscale(1) contrast(1.35) brightness(1.05)'}catch(e){}
  x.drawImage(img,pd,pd,iw,ih);
  b64=c.toDataURL('image/jpeg',q).split(',')[1];if(b64.length*.75<1.9*1048576)break;sc*=.8;q=.85}

  if(r.noPesanan){try{d=await run('cek',{no:r.noPesanan})}catch(e){}}                  // cek duplikat sebelum ringkasan ditampilkan

document.addEventListener('paste',e=>{                 // Ctrl+V screenshot nota di halaman POS
 if(!$('#fn')||!$('#ocr')||!$('#ocr').checked||(window.Swal&&Swal.isVisible()))return;
 const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>/^image\//.test(i.type));if(!it)return;

const tok=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const nk=s=>norm(s).replace(/o/g,'0').replace(/[il]/g,'1').replace(/s/g,'5');   // normalisasi kode: toleran salah baca OCR (O/0, I/l/1)
const skuMap=()=>{try{return JSON.parse(localStorage.getItem('skuMap')||'{}')}catch(e){return {}}};          // ingatan: SKU Penjual nota -> kode master (dipelajari dari pencocokan manual)

function matchItem(it){
 {const sm=skuMap()[nk(it.sku)];if(sm){const b0=S.barang.find(x=>x.kode===sm);if(b0)return b0}}                // cocokkan ke master: kode variasi/SKU (persis) > kode di teks > nama (semua kata nama harus ada) + ukuran/warna
 const rawN=nk(it.raw),sk=nk(it.sku),lt=tok((it.nama||it.raw)+' '+(it.variasi||'')),sc=[];
 S.barang.forEach(b=>{
  const kn=nk(b.kode);
  if(kn&&sk&&sk===kn)return sc.push({b:b,s:100});
  if(kn.length>=4&&rawN.includes(kn))return sc.push({b:b,s:99});
  const nt=tok(b.nama),vt=tok(b.ukuran+' '+b.warna);if(!nt.length)return;
  const nh=nt.filter(t=>lt.includes(t)).length/nt.length;if(nh<.8)return;
  const vh=vt.filter(t=>lt.includes(t)).length;sc.push({b:b,s:nh*10+nt.length*.3+vh*2-(vt.length-vh)*.5})});
 if(!sc.length)return null;const m=Math.max(...sc.map(x=>x.s)),top=sc.filter(x=>x.s>=m-.01);

function pushCart(b,q,l,h,src){

function shFix(r,src,its,got,warn){                 // Diskon Admin = harga jual offline - Subtotal Pesanan di nota Shopee; biaya disesuaikan agar total = Estimasi Total Penghasilan nota (idempoten: biaya dikembalikan ke hasil baca dulu)
 [['sh_bp','sh_bp'],['sh_bgo','sh_bgo'],['sh_bl','sh_bl'],['sh_blain','sh_blain'],['sh_pj','sh_pj'],['sh_blt','sh_blt']].forEach(x=>{const e=$('#'+x[0]);if(e&&e.dataset.auto===src)e.value=r[x[1]]==null?'':r[x[1]]});
                                  // Diskon Admin = harga jual offline - Subtotal Pesanan di nota Shopee; biaya disesuaikan agar total = Estimasi Total Penghasilan nota
  const sub=S.cart.reduce((t,c)=>t+c.qty*c.harga,0);let ns=r.subtotal;if(ns==null){const t=its.reduce((a,i)=>a+(i.harga>0?i.harga*i.qty:0),0);if(t>0)ns=t}
  const force=(id,v,nm)=>{const e=$(id);e.value=v;e.dataset.auto=src;e.classList.add('ring-2','ring-amber-400');got.push(nm+': '+v)};
  if(ns!=null&&sub>0){force('#sh_sub',ns,'Subtotal Pesanan (nota '+val('#pc')+')');got.push('Diskon Admin otomatis: '+rp(sub-ns)+' (harga barang '+rp(sub)+' − subtotal pesanan '+rp(ns)+')')}
  calc();
  if(val('#pc')==='TikTok'){if(r.penghasilan!=null){force('#tt_pg',r.penghasilan,'Perkiraan penghasilan');calc()}return}
  if(r.penghasilan!=null&&sub>0){const d=S.total-r.penghasilan;
   if(d>0){const id=num('#sh_bp')>0?'#sh_blain':'#sh_bp';force(id,num(id)+d,id==='#sh_bp'?'Biaya Platform (disesuaikan ke estimasi penghasilan nota)':'Biaya Lainnya (disesuaikan ke estimasi penghasilan nota)');calc()}
   else if(d<0)warn.push('Estimasi Total Penghasilan di nota '+rp(r.penghasilan)+' lebih besar dari hitungan form ('+rp(S.total)+'). Periksa biaya & subtotal.')}}
function ocrReview(pend,r,src,its){                // barang di nota yang belum cocok otomatis: pilih manual dari master barang (stok tersedia di lokasi ini)
 const l=posLoc(),bs=S.barang.filter(b=>b.stok[l]&&b.stok[l].sisa>0);
 const dl=bs.map(b=>`<option value="${esc(b.kode)} · ${esc(b.label)}"></option>`).join('');
 const row=(x,i)=>`<div class="mb-3 rounded-lg border p-2 text-left text-sm"><div class="mb-1 font-semibold">${esc(x.nm)||'(tanpa nama)'}</div>${x.amb?`<div class="mb-1 text-xs text-amber-600">Mirip: ${esc(x.amb.join(' / '))}</div>`:''}<div class="grid grid-cols-[1fr_5rem] gap-2"><input id="rv-b${i}" list="rv-dl" class="inp" placeholder="Ketik kode / nama barang (kosongkan = lewati)" autocomplete="off"><input id="rv-q${i}" type="number" min="1" value="${x.qty||1}" class="inp"></div></div>`;
 Swal.fire({title:'Cocokkan barang nota',width:680,showCancelButton:true,confirmButtonText:'Tambahkan ke keranjang',cancelButtonText:'Lewati',
  html:`<p class="mb-2 text-left text-sm text-slate-500">Barang berikut tidak cocok otomatis dengan master. Pilih barang yang benar (pilihan ini diingat: SKU yang sama otomatis cocok di nota berikutnya):</p><datalist id="rv-dl">${dl}</datalist>${pend.map(row).join('')}`,
  preConfirm:()=>{const out=[];for(let i=0;i<pend.length;i++){const v=($('#rv-b'+i).value||'').trim();if(!v)continue;
    const k=nk(v.split(' · ')[0]),b=bs.find(z=>nk(z.kode)===k)||bs.find(z=>norm(z.kode+' · '+z.label)===norm(v));
    if(!b){Swal.showValidationMessage('Barang tidak ditemukan: "'+v+'". Pilih dari daftar.');return false}
    out.push({b:b,q:Math.max(1,+$('#rv-q'+i).value||1),sku:pend[i].sku})}return out}})
 .then(x=>{if(!x.isConfirmed||!x.value||!x.value.length)return;const w=[];
  x.value.forEach(o=>{if(o.sku)skuSave(o.sku,o.b.kode);const m=pushCart(o.b,o.q,l,o.b.jual,src);if(m)w.push(m)});
  renderCart();if(isMk(val('#pc')))shFix(r,src,its,[],[]);calc();
  const k=S.cart.find(c=>c.auto===src),sk=(its.find(i=>i.sku)||{}).sku;if((k||sk)&&!$('#pk').value)setF('#pk',sk||k.kode,src);
  w.length?Swal.fire('Perlu dicek',w.join('<br>'),'warning'):okMsg(x.value.length+' barang ditambahkan')})}
function ocrApply(r,src,dup){
 if(String(r.text||'').replace(/\s/g,'').length<15&&!(r.items&&r.items.length)&&r.subtotal==null&&!r.noPesanan&&!r.nohp)return Swal.fire({icon:'info',title:'Teks tidak terbaca',width:600,html:'<p class="mb-2 text-left text-sm">Foto belum bisa dibaca. Coba:</p>'+OCR_TIPS,showCancelButton:true,confirmButtonText:'📋 Tempel teks nota',cancelButtonText:'Isi manual'}).then(x=>{if(x.isConfirmed)ocrPaste(src)});
 {const pn=$('#pn');if(r.noPesanan&&pn&&pn.value&&pn.dataset.auto&&norm(pn.value)!==norm(r.noPesanan)){          // nota pesanan LAIN: buang semua isian hasil baca nota sebelumnya agar tidak tercampur
  document.querySelectorAll('[data-auto]').forEach(e=>{if(e.id==='fn'||e.id==='fr')return;e.value='';delete e.dataset.auto;e.classList.remove('ring-2','ring-amber-400')});S.cart=S.cart.filter(c=>!c.auto)}}
 const l=posLoc(),got=[],skip=[],warn=[],pend=[],its=r.items||[],su=S.user.role==='SUPER',ship=!$('#ship').classList.contains('hidden');
 const put=(id,v,nm)=>{if(v===''||v==null||(typeof v==='number'&&isNaN(v)))return;setF(id,v,src)?got.push(nm+': '+v):skip.push(nm)};
 put('#ph',r.nohp,'No HP');put('#pn',r.noPesanan,'No. Pesanan');
 const isDup=!!(dup&&dup.dup&&norm($('#pn').value)===norm(r.noPesanan));markDup(isDup?dup:null);
 if(isDup)warn.push('DUPLIKAT: pesanan '+r.noPesanan+' sudah tercatat di nota '+dup.nota+' ('+dup.tanggal+', '+dup.channel+'). Pastikan tidak diinput dua kali.');
 if(ship){put('#sp',r.prov,'Provinsi');put('#sk',r.kab,'Kabupaten');put('#sc',r.kec,'Kecamatan');put('#sa',r.alamat,'Alamat');put('#se',r.ekspedisi,'Ekspedisi');put('#sw',r.berat,'Berat (gram)');
  put('#so',r.ongkir!=null?r.ongkir:(its.length?0:null),'Ongkir')}
 
 let isShopeeFee = false;
 if((r.platform==='TikTok'||r.platform==='Shopee')&&!isMk(val('#pc'))&&(S.user.role==='SUPER'||S.user.role==='GUDANG')){$('#pc').value=r.platform;posCh()}   // nota marketplace terbaca -> channel ikut berpindah
 if(isMk(val('#pc'))||r.sh_bp != null || r.sh_bl != null || r.sh_bgo != null || r.sh_blain != null || r.sh_pj != null || r.penghasilan != null) {
  const pf=r.platform==='TikTok'||r.platform==='Shopee'?r.platform:(isMk(val('#pc'))?val('#pc'):'Shopee');
  if(S.user.role==='SUPER'||S.user.role==='GUDANG'){$('#pc').value=pf;posCh()}
  ['sh_sub','sh_bp','sh_bgo','sh_bl','sh_blain','sh_pj','sh_blt','tt_sb','tt_dp','tt_dpl','tt_ob','tt_dos','tt_dop','tt_bp','tt_pp','tt_lain','tt_pg'].forEach(i=>{const e=$('#'+i);if(e&&e.dataset.auto){e.value='';delete e.dataset.auto;e.classList.remove('ring-2','ring-amber-400')}});   // buang sisa hasil baca nota sebelumnya
    put('#sh_bp', r.sh_bp, 'Biaya Platform');
  put('#sh_bgo', r.sh_bgo, 'B. Gratis Ongkir XTRA');
  put('#sh_bl', r.sh_bl, 'Biaya Layanan');
  put('#sh_blain', r.sh_blain, 'Biaya Lainnya');
  put('#sh_pj', r.sh_pj, 'Pajak');
  put('#sh_blt', r.sh_blt, 'Sub. Biaya Layanan Tambahan');
  if(pf==='TikTok')[['tt_sb','Subtotal item sebelum diskon'],['tt_dp','Diskon produk dari penjual'],['tt_dpl','Diskon produk dari platform'],['tt_ob','Biaya pengiriman sebelum diskon'],['tt_dos','Diskon ongkir dari penjual'],['tt_dop','Diskon ongkir dari platform'],['tt_bp','Biaya penanganan'],['tt_pp','Premi proteksi']].forEach(x=>put('#'+x[0],r[x[0]],x[1]));
  if(pf==='TikTok'){if(r.tt_lain>0)put('#tt_lain',r.tt_lain,'Biaya lain di nota');(r.cek||[]).forEach(x=>warn.push(x))}
  calcShopee();
  isShopeeFee = true;
 }

 if(!isShopeeFee && (its.length||r.subtotal!=null))put('#pd',r.diskon!=null?r.diskon:0,'Diskon');
 if(!its.length&&S.barang.length){const T=nk(r.text||'');          // jaring pengaman: tidak ada barang terbaca -> cari kode master di teks OCR
  S.barang.forEach(b=>{const k=nk(b.kode);
   if(k.length>=5&&/[a-z]/i.test(String(b.kode))&&T.includes(k)){
    its.push({raw:b.kode,nama:'',variasi:'',sku:b.kode,qty:1,harga:0});
    warn.push('Kode '+b.kode+' ditemukan di teks nota, qty diisi 1: periksa jumlahnya')}})}
 if(its.length)S.cart=S.cart.filter(c=>c.auto!==src);          // scan ulang dokumen yang sama = ganti; dokumen lain tidak ikut terhapus
 its.forEach(it=>{const b=matchItem(it),nm=[it.nama,it.variasi,it.sku?'(kode '+it.sku+')':''].filter(Boolean).join(' ');
  if(!b)pend.push({nm:nm,qty:it.qty,amb:null,sku:it.sku});
  if(!b)return warn.push('Belum ada di master barang: "'+nm+'" × '+it.qty+'. Daftarkan dulu lewat Master Barang → Barang baru, lalu scan ulang.');
  if(b.amb)pend.push({nm:nm,qty:it.qty,amb:b.amb,sku:it.sku});
  if(b.amb)return warn.push('Ambigu "'+nm+'" → '+b.amb.join(' / ')+' (tambahkan manual)');
  const w=pushCart(b,it.qty,l,it.harga,src);
  if(w)return warn.push(w);
  got.push(b.kode+' · '+b.label+' × '+it.qty+' @ '+rp(b.jual))});
  renderCart();
 if(isShopeeFee)shFix(r,src,its,got,warn);
 const k=S.cart.find(c=>c.auto===src),sk=(its.find(i=>i.sku)||{}).sku;if(k||sk)put('#pk',sk||k.kode,'Kode barang'+(sk?' (SKU Penjual)':''));
 const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
 Swal.fire({icon:warn.length?'warning':got.length?'success':'info',title:isDup?'Perhatian: pesanan sudah pernah dicatat!':got.length?'Data terbaca & terisi':'Tidak ada data yang bisa diisi',width:640,confirmButtonText:pend.length?'Cocokkan barang':'Saya periksa',
  html:`<div class="text-left text-sm">${got.length?`<b>Terisi otomatis</b><ul class="list-disc pl-5">${li(got)}</ul>`:''}${warn.length?`<b class="mt-2 block text-amber-600">Perlu dicek</b><ul class="list-disc pl-5">${li(warn)}</ul>`:''}${skip.length?`<p class="mt-2 text-slate-500">Dilewati (sudah terisi): ${esc(skip.join(', '))}</p>`:''}${r.resi?`<p class="mt-2">No. resi terbaca: <b>${esc(r.resi)}</b></p>`:''}${!ship&&(r.alamat||r.ekspedisi)?'<p class="mt-2 text-slate-500">Data pengiriman tidak diisi karena channel offline.</p>':''}<details class="mt-3"><summary class="cursor-pointer">Teks mentah hasil OCR</summary><pre class="mt-1 max-h-48 overflow-auto whitespace-pre-wrap text-xs">${esc((r.text||'').slice(0,2500))}</pre></details><p class="mt-3 text-xs text-slate-500">Kolom bergaris kuning hasil OCR. Mohon periksa sebelum menyimpan transaksi.</p></div>`}).then(()=>{if(pend.length)ocrReview(pend,r,src,its)})}

/* ===== Edit data: satu pop-up untuk semua jenis data (stok & data terkait disesuaikan otomatis di server) ===== */
const edF=(id,l,v,t,x)=>`<div><label class="lbl">${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v)}" class="inp" ${x||''}></div>`;
const edS=(id,l,a,v,x)=>{const o=(v===''||v==null||a.includes(v))?a:[v].concat(a);return `<div><label class="lbl">${l}</label><select id="${id}" class="inp" ${x||''}>${o.map(z=>`<option ${z===v?'selected':''}>${esc(z)}</option>`).join('')}</select></div>`};
function edClose(){const m=document.getElementById('edm');if(m)m.remove()}
function edOpen(title,body,save,wide){
 edClose();const m=document.createElement('div');m.id='edm';m.className='fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/50 p-4';
 m.innerHTML=`<div class="card my-6 w-full ${wide?'max-w-4xl':'max-w-xl'}"><div class="mb-4 flex items-center justify-between gap-3"><h3 class="text-lg font-bold">${title}</h3><button class="btn2" onclick="edClose()" aria-label="Tutup">✕</button></div><div>${body}</div><div class="mt-5 flex justify-end gap-2"><button class="btn2 py-2" onclick="edClose()">Batal</button><button class="btn" id="edsv">Simpan perubahan</button></div></div>`;
 document.body.appendChild(m);
 $('#edsv').onclick=()=>guard($('#edsv'),async()=>{const msg=await save();edClose();okMsg(msg||'Perubahan disimpan');await go(S.cur)})}

/* -- Transaksi: barang, qty, harga, pembayaran, data pengiriman. Stok lokasi dihitung ulang (kembalikan yang lama, potong yang baru). -- */
async function edTrx(n){
 Swal.fire({title:'Memuat nota...',allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 let d;try{[d,S.barang]=await Promise.all([run('trxGet',{nota:n}),run('barang')]);Swal.close()}catch(e){return fail(e)}
 const bad=d.items.find(x=>!x.kode);
 if(bad)return Swal.fire('Tidak bisa diedit','Barang "'+bad.nama+'" sudah tidak ada di master barang. Daftarkan ulang barangnya lebih dulu, atau hapus nota ini.','warning');
 S.ed={loc:d.lokasi,items:d.items.map(x=>({kode:x.kode,nama:x.nama,qty:x.qty,harga:x.harga}))};
 const off=String(d.channel).startsWith('Offline'),l=d.lokasi;
 edOpen('Edit transaksi '+esc(n),`<div class="grid gap-3 sm:grid-cols-3">
   ${edF('e-tgl','Tanggal',d.tanggal,'date')}
   ${l==='GUDANG'?edS('e-ch','Channel',CHG,d.channel):edF('e-ch','Channel',d.channel,'text','disabled')}
   ${edF('e-lok','Lokasi stok',l,'text','disabled')}
   ${edF('e-hp','No HP',d.nohp,'text','inputmode="tel"')}
   ${edF('e-no','No. Pesanan',d.noPesanan)}
   ${edF('e-eks','Ekspedisi',d.ekspedisi)}
   ${edF('e-brt','Berat (gram)',d.berat,'number','min="0"')}
   ${edF('e-ong','Ongkir',d.ongkir,'number','min="0" oninput="edTot()"')}
   ${edF('e-dsk','Diskon',d.diskon,'number','min="0" oninput="edTot()"')}
   ${edF('e-byr','Uang diterima (terbayar)',d.terbayar,'number','min="0" oninput="edTot()"')}
   ${edF('e-prov','Provinsi',d.prov)}${edF('e-kab','Kabupaten',d.kab)}${edF('e-kec','Kecamatan',d.kec)}
   <div class="sm:col-span-3">${edF('e-alm','Alamat',d.alamat)}</div></div>
  <h4 class="mb-2 mt-4 text-sm font-bold">Barang</h4><div id="e-items"></div>
  <div class="mt-3 grid items-end gap-2 sm:grid-cols-[1fr_6rem_auto]"><div><label class="lbl">Tambah barang (ketik kode atau nama)</label><input id="e-add" list="e-dl" class="inp" autocomplete="off"><datalist id="e-dl">${S.barang.filter(b=>b.stok[l]).map(b=>`<option value="${esc(b.kode)} · ${esc(b.label)} — sisa ${b.stok[l].sisa}"></option>`).join('')}</datalist></div>
   <div><label class="lbl">Qty</label><input id="e-aq" type="number" min="1" value="1" class="inp"></div><button class="btn" onclick="edAdd()">Tambah</button></div>
  <div id="e-tot" class="mt-4 rounded-xl bg-slate-50 p-3 text-sm dark:bg-slate-900"></div>
  <p class="mt-2 text-xs text-slate-500">Stok ${esc(l)} dikembalikan dari barang lama lalu dipotong sesuai barang baru, jadi Master Stok otomatis sinkron. Harga bersifat read-only. Nota PDF dibuat ulang.</p>`,
  async()=>{
   if(!S.ed.items.length)throw new Error('Nota minimal punya satu barang');
   const r=await run('editTrx',{nota:n,tanggal:val('#e-tgl'),channel:val('#e-ch'),nohp:val('#e-hp'),noPesanan:val('#e-no').trim(),ekspedisi:val('#e-eks'),berat:num('#e-brt'),ongkir:num('#e-ong'),diskon:num('#e-dsk'),terbayar:num('#e-byr'),
    prov:val('#e-prov'),kab:val('#e-kab'),kec:val('#e-kec'),alamat:val('#e-alm'),items:S.ed.items.map(x=>({kode:x.kode,qty:x.qty,harga:x.harga}))});
   return 'Transaksi diperbarui, stok disesuaikan'+(r.notaErr?' (nota PDF belum terbuat, buat ulang dari tabel)':'')},true);
 edItems()}
function edItems(){const it=S.ed.items;
 $('#e-items').innerHTML=table([['Barang',x=>`<span class="text-xs text-slate-500">${esc(x.kode)}</span><br>${esc(x.nama)}`],
  ['Harga',x=>rp(x.harga)],
  ['Qty',x=>`<input type="number" min="1" class="inp w-20" value="${x.qty}" onchange="edQty(${it.indexOf(x)},this)">`],
  ['',x=>`<button class="btn2" onclick="S.ed.items.splice(${it.indexOf(x)},1);edItems()">Hapus</button>`]],it);edTot()}
function edQty(i,el){const q=+el.value;if(!(q>0)||q%1){Swal.fire('Qty tidak valid','Qty harus bilangan bulat lebih dari 0.','warning');el.value=S.ed.items[i].qty;return}S.ed.items[i].qty=q;edItems()}
function edAdd(){const k=val('#e-add').split(' · ')[0].trim().toUpperCase(),q=+val('#e-aq'),b=S.barang.find(x=>String(x.kode).toUpperCase()===k);
 if(!b)return Swal.fire('Barang tidak ditemukan','Pilih barang dari daftar saran.','warning');
 if(!(q>0)||q%1)return Swal.fire('Qty tidak valid','Qty harus bilangan bulat lebih dari 0.','warning');
 const ex=S.ed.items.find(x=>x.kode===b.kode);ex?ex.qty+=q:S.ed.items.push({kode:b.kode,nama:b.label,qty:q,harga:b.jual});

function edUser(i){const u=S.usrL[i];if(!u)return;

/* ===== Hapus data & sinkron stok ===== */
async function delAct(action,payload,title,html){
 const c=await Swal.fire({icon:'warning',title:title,html:html+'<br><small class="text-slate-500">Salinan data dicatat di sheet Log Aktivitas.</small>',showCancelButton:true,confirmButtonText:'Ya, hapus',cancelButtonText:'Batal',confirmButtonColor:'#EF4444'});
 if(!c.isConfirmed)return null;
 Swal.fire({title:'Memproses...',allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 try{return await run(action,payload)||true}catch(e){fail(e);return null}}
async function afterDel(msg,warn){
 await Swal.fire({icon:warn?'warning':'success',title:msg,text:warn||'',timer:warn?undefined:1800,showConfirmButton:!!warn});go(S.page)}
async function delTrx(n,loc){
 const r=await delAct('delTrx',{nota:n},'Hapus transaksi '+n+'?',`Stok barang pada nota ini akan <b>dikembalikan ke ${esc(loc)}</b>.<br>Lampiran dan nota PDF dipindahkan ke sampah Drive.`);
 if(r)afterDel('Transaksi dihapus, stok '+loc+' dikembalikan',r.skipped&&r.skipped.length?'Stok tidak bisa dikembalikan untuk: '+r.skipped.join(', ')+' (barang sudah tidak ada di master).':'')}
async function delMut(id){
 const r=await delAct('delMut',{id:id},'Batalkan mutasi stok ini?','Pengaruh mutasi pada stok akan dibalikkan. Jika stok hasil mutasi sudah terjual atau keluar, pembatalan ditolak.');
 if(r)afterDel('Mutasi dibatalkan, stok dikembalikan')}
async function delBrg(i){const b=S.barang[i];if(!b)return;const st=Object.keys(b.stok).map(l=>l+' '+b.stok[l].sisa).join(' · ');
 const r=await delAct('delBrg',{kode:b.kode},'Hapus barang '+b.kode+'?',`${esc(b.label)}<br>Sisa stok saat ini: <b>${esc(st)}</b> (ikut terhapus).<br>Transaksi lama tetap ada, tetapi stoknya tidak bisa dikembalikan jika transaksi itu dihapus.`);
 if(r)afterDel('Barang dihapus')}
async function delExp(i){const e=S.expL[i];if(!e)return;
 const r=await delAct('delExp',{row:e.row,sig:e.sig},'Hapus pengeluaran?',`${esc(e.kategori)} · ${rp(e.nominal)} · ${esc(e.lokasi)}<br>${esc(e.ket||'')}`);
 if(r)afterDel('Pengeluaran dihapus')}
async function delAst(i){const a=S.astL[i];if(!a)return;
 const r=await delAct('delAst',{kode:a.kode},'Hapus aset '+a.kode+'?',esc(a.nama)+' · '+esc(a.lokasi));
 if(r)afterDel('Aset dihapus')}
async function delUser(i){const u=S.usrL[i];if(!u)return;
 const r=await delAct('delUser',{username:u.username},'Hapus user '+u.username+'?',esc(u.nama)+' · '+(ROLEN[u.role]||u.role)+'<br>Jika user sedang login, sesinya berakhir otomatis maksimal 6 jam.');
 if(r)afterDel('User dihapus')}
async function syncStok(){
 Swal.fire({title:'Menyinkronkan stok...',allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 try{const r=await run('syncStok');await okMsg(r.fixed?r.fixed+' barang disesuaikan (Sisa = Awal + Masuk - Keluar)':'Semua stok sudah sinkron');go('stok')}catch(e){fail(e)}}
const mutCard=l=>`<div class="card mt-4"><h3 class="mb-1 font-bold">Riwayat mutasi stok</h3><p class="mb-3 text-xs text-slate-500">Edit qty atau batalkan mutasi; stok ikut disesuaikan. Hanya mutasi yang dicatat sejak fitur ini aktif.</p>${table([['Waktu',r=>r.waktu],['Jenis',r=>r.jenis],['Barang',r=>esc(r.nama)],['Dari',r=>r.dari||'-'],['Ke',r=>r.ke||'-'],['Qty',r=>r.qty],['Oleh',r=>esc(r.user)],['',r=>`<button class="btn2" onclick="edMut('${esc(r.id)}')">Edit</button>`],['',r=>`<button class="btn2 text-red-600" onclick="delMut('${esc(r.id)}')">Batalkan</button>`]],l)}</div>`;

/* ===== Data Laporan: Harian (format Looker) & Bulanan ===== */
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const fTgl=k=>{const a=String(k).split('-');return +a[2]+' '+MON[+a[1]-1]+' '+a[0]};
const hari=k=>{const a=String(k).split('-');return HARI[new Date(+a[0],a[1]-1,+a[2]).getDay()]};
const nf=n=>Math.round(+n||0).toLocaleString('id-ID');

/* --- Laporan Harian: ringkasan, per channel, tren, rincian transaksi (termasuk Rincian Biaya Shopee & TikTok), Gudang & Mall --- */
const CHC={Shopee:'bg-orange-100 text-orange-700 dark:bg-orange-950 dark:text-orange-300',TikTok:'bg-fuchsia-100 text-fuchsia-700 dark:bg-fuchsia-950 dark:text-fuchsia-300',WhatsApp:'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'};
const chBadge=c=>`<span class="whitespace-nowrap rounded-full px-2.5 py-0.5 text-[11px] font-semibold ${CHC[c]||'bg-teal-100 text-teal-700 dark:bg-teal-950 dark:text-teal-300'}">${esc(c)}</span>`;
const stBadge=s=>`<span class="whitespace-nowrap rounded-full px-2.5 py-0.5 text-[11px] font-semibold ${s==='Lunas'?'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300':'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'}">${esc(s||'-')}</span>`;
const kpi=(l,v,sub,ac)=>`<div class="relative overflow-hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800"><div class="absolute inset-y-0 left-0 w-1 ${ac||'bg-teal-600'}"></div><div class="pl-2"><div class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">${l}</div><div class="mt-1 text-xl font-extrabold tracking-tight sm:text-2xl">${v}</div>${sub?`<div class="mt-0.5 text-xs text-slate-500">${sub}</div>`:''}</div></div>`;
const lhHead=(t,r)=>`<div class="mb-3 flex items-center justify-between gap-2"><h3 class="text-sm font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">${t}</h3>${r||''}</div>`;
const pct=(a,b)=>b>0?Math.round(a/b*1000)/10:0;
const rinciBold=l=>/^(total|subtotal|perkiraan|estimasi|penghasilan|biaya pengiriman setelah)/i.test(l);
function rinciHtml(rows){return `<table class="w-full text-sm"><tbody>${rows.map(x=>{const neg=x[1]<0,b=rinciBold(x[0]);
  return `<tr class="border-b border-slate-100 last:border-0 dark:border-slate-700/60"><td class="py-1.5 pr-3 ${b?'font-semibold':'text-slate-600 dark:text-slate-300'}">${esc(x[0])}</td><td class="py-1.5 text-right tabular-nums ${neg?'text-rose-600':''} ${b?'font-bold':''}">${neg?'-':''}${rp(Math.abs(x[1]))}</td></tr>`}).join('')}</tbody></table>`}
function lhNota(n){
 const mk=n.channel==='Shopee'||n.channel==='TikTok',q=[n.nota,n.noPesanan,n.channel,n.hp,n.items.map(i=>i.n).join(' ')].join(' ').toLowerCase();
 const bayar=[['Subtotal barang',n.sub],['Ongkir',n.ongkir],['Diskon / potongan',-n.diskon],['Total',n.total],['Diterima',n.terbayar],['Sisa tagihan',n.sisa]].filter(x=>x[1]||x[0]==='Total');
 const lnk=[[n.linkSistem,'Nota PDF'],[n.linkNota,'Foto nota'],[n.linkResi,'Foto resi']].filter(x=>x[0]).map(x=>`<a class="btn2" href="${esc(x[0])}" target="_blank" rel="noopener">${x[1]}</a>`).join('');
 return `<details class="lh-n group rounded-xl border border-slate-200 bg-white open:shadow-md dark:border-slate-700 dark:bg-slate-800" data-q="${esc(q)}" data-c="${esc(n.channel)}">
  <summary class="flex cursor-pointer list-none [&::-webkit-details-marker]:hidden flex-wrap items-center gap-x-4 gap-y-1 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/40">
   <span class="w-36 font-mono text-xs font-semibold">${esc(n.nota)}</span><span class="w-24 text-xs text-slate-500">${fTgl(n.tanggal)}</span>${chBadge(n.channel)}
   <span class="min-w-0 flex-1 truncate text-xs text-slate-500">${n.noPesanan?'Pesanan '+esc(n.noPesanan)+' · ':''}${esc(n.items.map(i=>i.n+' ×'+i.q).join(', '))}</span>
   <span class="text-right text-sm font-bold tabular-nums">${rp(n.total)}</span>${stBadge(n.status)}<span class="text-slate-400 transition group-open:rotate-180">▾</span></summary>
  <div class="grid gap-4 border-t border-slate-100 p-4 dark:border-slate-700 ${mk&&n.rinci.length?'lg:grid-cols-2':'lg:grid-cols-2'}">
   <div><div class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Barang</div>
    <table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500"><th class="pb-1">Barang</th><th class="pb-1 text-center">Qty</th><th class="pb-1 text-right">Harga</th><th class="pb-1 text-right">Subtotal</th></tr></thead><tbody>${n.items.map(i=>`<tr class="border-t border-slate-100 dark:border-slate-700/60"><td class="py-1.5 pr-2">${esc(i.n)}</td><td class="py-1.5 text-center">${i.q}</td><td class="py-1.5 text-right tabular-nums">${nf(i.harga)}</td><td class="py-1.5 text-right tabular-nums">${nf(i.sub)}</td></tr>`).join('')}</tbody></table>
    <div class="mt-3 grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-500">${n.hp?`<div>No HP: <b class="text-slate-700 dark:text-slate-200">${esc(n.hp)}</b></div>`:''}${n.ekspedisi?`<div>Ekspedisi: <b class="text-slate-700 dark:text-slate-200">${esc(n.ekspedisi)}</b></div>`:''}<div>Lokasi stok: <b class="text-slate-700 dark:text-slate-200">${esc(n.lokasi)}</b></div><div>Profit nota: <b class="text-slate-700 dark:text-slate-200">${rp(n.profit)}</b></div></div>
    ${lnk?`<div class="mt-3 flex flex-wrap gap-2">${lnk}</div>`:''}</div>
   <div>${mk&&n.rinci.length?`<div class="mb-1 flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-500">Rincian Biaya ${esc(n.channel)}<span class="rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-medium normal-case tracking-normal dark:bg-slate-700">opsional · sesuai nota ${esc(n.channel)}</span></div><div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-900/60">${rinciHtml(n.rinci)}</div>`
    :`<div class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Ringkasan Pembayaran</div><div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-900/60">${rinciHtml(bayar)}</div>${mk?'<p class="mt-2 text-xs text-slate-400">Rincian biaya '+esc(n.channel)+' tidak tersimpan pada transaksi ini (dicatat sebelum fitur rincian).</p>':''}`}
    ${mk&&n.rinci.length?`<div class="mt-3 rounded-xl border border-slate-200 p-3 dark:border-slate-700"><div class="mb-1 text-xs font-bold uppercase tracking-wider text-slate-500">Ringkasan Pembayaran</div>${rinciHtml(bayar)}</div>`:''}</div></div></details>`}
function lhFlt(){const q=(S.lhQ||'').toLowerCase(),c=S.lhCh||'';let n=0;
 document.querySelectorAll('.lh-n').forEach(e=>{const h=!!((q&&!(e.dataset.q||'').includes(q))||(c&&e.dataset.c!==c));e.classList.toggle('hidden',h);if(!h)n++});
 const el=$('#lh-cnt');if(el)el.textContent=n+' transaksi'}
function lhTab(t){S.lhTab=t;lapHRender(S.lapH)}
function lhRange(k){const d=new Date(),z=x=>new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);let f=new Date(d),t=new Date(d);
 if(k==='kemarin'){f.setDate(f.getDate()-1);t=new Date(f)}else if(k==='7')f.setDate(f.getDate()-6);else if(k==='bln')f=new Date(d.getFullYear(),d.getMonth(),1);
 else if(k==='blnl'){f=new Date(d.getFullYear(),d.getMonth()-1,1);t=new Date(d.getFullYear(),d.getMonth(),0)}
 $('#lh-f').value=z(f);$('#lh-t').value=z(t);guard($('#lh-go'),lapHFetch)}
async function pLapH(){
 S.page='lapH';S.lapH=null;S.lhTab='rinci';S.lhQ='';S.lhCh='';
 V(`<div class="card"><div class="flex flex-wrap items-end justify-between gap-4">
  <div><h2 class="text-lg font-extrabold tracking-tight">Laporan Harian</h2><p class="text-xs text-slate-500">Ringkasan penjualan, rincian transaksi, dan rincian biaya Shopee &amp; TikTok</p></div>
  <div class="flex flex-wrap items-end gap-2"><div><label class="lbl">Dari tanggal</label><input id="lh-f" type="date" value="${today()}" class="inp"></div>
  <div><label class="lbl">Sampai tanggal</label><input id="lh-t" type="date" value="${today()}" class="inp"></div>
  <button class="btn" id="lh-go" onclick="guard(this,lapHFetch)">Tampilkan</button><button class="btn2 py-2" id="lh-pdf" onclick="lapHPdf()" disabled>Unduh PDF</button></div></div>
  <div class="mt-3 flex flex-wrap gap-2 text-xs">${[['Hari ini','0'],['Kemarin','kemarin'],['7 hari terakhir','7'],['Bulan ini','bln'],['Bulan lalu','blnl']].map(x=>`<button class="rounded-full border border-slate-300 px-3 py-1 font-medium transition hover:bg-teal-50 hover:text-teal-700 dark:border-slate-600 dark:hover:bg-slate-700" onclick="lhRange('${x[1]}')">${x[0]}</button>`).join('')}</div></div><div id="lh-out"></div>`);
 await lapHFetch()}
async function lapHFetch(){
 const f=val('#lh-f'),t=val('#lh-t');
 if(!f||!t)throw new Error('Pilih rentang tanggal');
 if(t<f)throw new Error('Tanggal "sampai" lebih awal dari tanggal "dari"');
 const d=await run('lapH',{from:f,to:t});S.lapH=d;lapHRender(d);$('#lh-pdf').disabled=false}
function lapHRender(d){
 const r=S.user.role,t=d.tot,showG=r==='SUPER'||r==='GUDANG',showM=r!=='GUDANG',per=d.from===d.to?fTgl(d.from):fTgl(d.from)+' – '+fTgl(d.to);
 if(S.lhChart){try{S.lhChart.destroy()}catch(e){}S.lhChart=null}
 const tabs=[['rinci','Rincian Transaksi ('+d.notaTotal+')']].concat(showG?[['gd','Penjualan Gudang']]:[],showM?[['ml','Penjualan Mall']]:[]);
 if(!tabs.some(x=>x[0]===S.lhTab))S.lhTab='rinci';
 const mx=Math.max(...d.ch.map(c=>c.penjualan),1),chs=d.ch.length?d.ch.map(c=>`<div class="mb-3 last:mb-0"><div class="mb-1 flex items-center justify-between gap-2 text-sm"><span class="flex items-center gap-2">${chBadge(c.channel)}<span class="text-xs text-slate-500">${c.nota} nota · ${c.qty} pcs</span></span><b class="tabular-nums">${rp(c.penjualan)}</b></div>
   <div class="h-2 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700"><div class="h-full rounded-full bg-gradient-to-r from-teal-500 to-teal-700" style="width:${pct(c.penjualan,mx)}%"></div></div>
   <div class="mt-1 flex justify-between text-[11px] text-slate-500"><span>${pct(c.penjualan,t.penjualan)}% dari total</span><span>Diskon ${nf(c.diskon)} · Diterima ${nf(c.penerimaan)}</span></div></div>`).join(''):'<p class="text-sm text-slate-400">Belum ada penjualan pada periode ini.</p>';
 const tops=d.top.length?d.top.map((x,i)=>`<div class="flex items-center gap-3 border-b border-slate-100 py-2 last:border-0 dark:border-slate-700/60"><span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-teal-50 text-[11px] font-bold text-teal-700 dark:bg-teal-950 dark:text-teal-300">${i+1}</span><span class="min-w-0 flex-1 truncate text-sm">${esc(x.artikel)}</span><span class="text-xs text-slate-500">${x.qty} pcs</span><b class="w-28 text-right text-sm tabular-nums">${rp(x.nominal)}</b></div>`).join(''):'<p class="text-sm text-slate-400">Belum ada data.</p>';
 let h=`<div class="mt-4 flex items-center justify-between"><div class="text-sm font-semibold text-slate-600 dark:text-slate-300">Periode ${per}</div><div class="text-xs text-slate-400">${d.notaTotal} transaksi · ${t.qty} pcs</div></div>
  <div class="mt-3 grid grid-cols-2 gap-3 md:grid-cols-4">${kpi('Total Penjualan',rp(t.penjualan),'Nilai barang terjual')}${kpi('Total Penerimaan',rp(t.penerimaan),'Uang masuk / diterima','bg-emerald-600')}${kpi('Profit Kotor',rp(t.profit),'Setelah diskon &amp; biaya','bg-indigo-600')}${kpi('Piutang',rp(t.piutang),'Belum dibayar',t.piutang>0?'bg-amber-500':'bg-slate-300')}
  ${kpi('Diskon / Potongan',rp(t.diskon),'Termasuk biaya marketplace','bg-rose-500')}${kpi('Ongkos Kirim',rp(t.ongkir),'','bg-sky-500')}${kpi('Transaksi',t.nota,'Jumlah nota','bg-violet-500')}${kpi('Qty Terjual',t.qty,'Total pcs','bg-teal-600')}</div>
  <div class="mt-4 grid gap-4 lg:grid-cols-2"><div class="card">${lhHead('Penjualan per Channel')}${chs}</div><div class="card">${lhHead('Artikel Terlaris')}${tops}</div></div>
  ${d.daily.length>1?`<div class="card mt-4">${lhHead('Tren Penjualan Harian')}<div class="h-56"><canvas id="lh-ch"></canvas></div></div>`:''}
  <div class="card mt-4"><div class="mb-4 flex flex-wrap gap-1 rounded-xl bg-slate-100 p-1 dark:bg-slate-900/60">${tabs.map(x=>`<button class="flex-1 whitespace-nowrap rounded-lg px-3 py-2 text-sm font-semibold transition ${S.lhTab===x[0]?'bg-white text-teal-700 shadow dark:bg-slate-700 dark:text-teal-300':'text-slate-500 hover:text-slate-700'}" onclick="lhTab('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
 if(S.lhTab==='rinci'){
  h+=`<div class="mb-3 flex flex-wrap items-center gap-2"><input class="inp max-w-xs" placeholder="Cari nota, no pesanan, barang..." value="${esc(S.lhQ)}" oninput="S.lhQ=this.value;lhFlt()"><select class="inp max-w-[10rem]" onchange="S.lhCh=this.value;lhFlt()"><option value="">Semua channel</option>${d.ch.map(c=>`<option ${S.lhCh===c.channel?'selected':''}>${esc(c.channel)}</option>`).join('')}</select><span id="lh-cnt" class="ml-auto text-xs text-slate-500"></span></div>
   <div class="space-y-2">${d.notas.map(lhNota).join('')||'<p class="py-6 text-center text-sm text-slate-400">Tidak ada transaksi pada periode ini.</p>'}</div>${d.notaTotal>d.notas.length?`<p class="mt-3 text-xs text-slate-400">Menampilkan ${d.notas.length} transaksi terbaru dari ${d.notaTotal}. Persempit rentang tanggal untuk melihat semuanya.</p>`:''}`}

/* ===== Pilih banyak & hapus massal =====
 * Checkbox otomatis muncul di tabel yang punya tombol Hapus/Batalkan. Memakai fungsi hapus per-item di server. */
function bkItem(btn){
 const m=(btn.getAttribute('onclick')||'').match(/^(del(?:Trx|Brg|Mut|Exp|Ast|User))\((.*)\)$/);if(!m)return null;
 const f=m[1],a=(m[2].match(/'((?:[^'\\]|\\.)*)'|\d+/g)||[]).map(x=>x[0]==="'"?x.slice(1,-1):+x);
 if(f==='delTrx')return{f:f,label:'Nota '+a[0],payload:{nota:a[0]}};
 if(f==='delMut')return{f:f,label:'Mutasi '+a[0],payload:{id:a[0]}};
 if(f==='delBrg'){const b=S.barang[a[0]];return b?{f:f,label:b.kode+' · '+b.label,payload:{kode:b.kode}}:null}
 if(f==='delAst'){const x=S.astL[a[0]];return x?{f:f,label:x.kode+' · '+x.nama,payload:{kode:x.kode}}:null}
 if(f==='delExp'){const x=S.expL[a[0]];return x?{f:f,label:x.tanggal+' · '+x.kategori+' · '+rp(x.nominal),payload:{row:x.row,sig:x.sig},row:+x.row||0}:null}
 if(f==='delUser'){const x=S.usrL[a[0]];if(!x)return null;return x.username===S.user.username?{skip:true}:{f:f,label:'User '+x.username,payload:{username:x.username}}}
 return null}
function enhance(){
 document.querySelectorAll('#view table').forEach(tb=>{
  if(!tb.tBodies[0]||tb.dataset.bk)return;
  const rows=[...tb.tBodies[0].rows],its=rows.map(r=>{const b=[...r.querySelectorAll('button')].find(x=>/^del(Trx|Brg|Mut|Exp|Ast|User)\(/.test(x.getAttribute('onclick')||''));return b?bkItem(b):null});
  if(!its.some(x=>x&&!x.skip))return;
  tb.dataset.bk=1;
  [...tb.tHead.rows].forEach((hr,hi,ha)=>{const th=document.createElement('th');th.className='th';if(hi===ha.length-1)th.innerHTML='<input type="checkbox" class="bk bkh" aria-label="Pilih semua yang tampil" onchange="bkAll(this)">';hr.insertBefore(th,hr.firstChild)});   // tabel dengan 2 baris judul (grup lokasi): checkbox di baris judul terakhir
  rows.forEach((r,i)=>{const td=document.createElement('td');td.className='td';
   if(its[i]&&!its[i].skip){td.innerHTML='<input type="checkbox" class="bk" aria-label="Pilih baris" onchange="bkCnt(this)">';r._bk=its[i]}
   r.insertBefore(td,r.firstChild)});
  const bar=document.createElement('div');bar.className='bkbar mb-3 hidden items-center gap-3 rounded-xl bg-red-50 p-2 text-sm dark:bg-red-950/40';
  bar.innerHTML='<span class="bkn font-semibold"></span><button class="btn2 text-red-600" onclick="bkDel(this)">Hapus terpilih</button><button class="btn2" onclick="bkClear(this)">Batal pilih</button>';
  tb.parentElement.before(bar)})}
const bkTb=el=>el.closest('table')||el.closest('.bkbar').nextElementSibling.querySelector('table');
const bkRows=tb=>[...tb.tBodies[0].rows].filter(r=>r._bk&&r.querySelector('input.bk:checked'));
function bkCnt(el){const tb=bkTb(el),n=bkRows(tb).length,bar=tb.parentElement.previousElementSibling;
 bar.classList.toggle('hidden',!n);bar.classList.toggle('flex',!!n);bar.querySelector('.bkn').textContent=n+' dipilih'}
function bkAll(el){const tb=bkTb(el);tb.querySelectorAll('tbody tr:not(.hidden) input.bk').forEach(c=>c.checked=el.checked);bkCnt(el)}
function bkClear(el){const tb=bkTb(el);tb.querySelectorAll('input.bk').forEach(c=>c.checked=false);bkCnt(tb.querySelector('input.bk')||el)}
async function bkDel(el){
 const tb=bkTb(el);let its=bkRows(tb).map(r=>r._bk);if(!its.length)return;
 if(its[0].f==='delExp')its=its.sort((a,b)=>b.row-a.row);          // hapus dari baris paling bawah agar nomor baris tidak bergeser
 const n=its.length,lst=its.slice(0,8).map(x=>'<li>'+esc(x.label)+'</li>').join('')+(n>8?'<li>... dan '+(n-8)+' lainnya</li>':'');
 const c=await Swal.fire({icon:'warning',title:'Hapus '+n+' data terpilih?',html:'<ul class="list-disc pl-5 text-left text-sm">'+lst+'</ul><small class="text-slate-500">Aturan sama seperti hapus satu per satu (mis. stok transaksi dikembalikan).</small>',showCancelButton:true,confirmButtonText:'Ya, hapus semua',cancelButtonText:'Batal',confirmButtonColor:'#EF4444'});
 if(!c.isConfirmed)return;
 Swal.fire({title:'Menghapus...',html:'<span id="bk-p">0 / '+n+'</span>',allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 let ok=0;const err=[];
 for(const it of its){
  try{await run(it.f,it.payload);ok++}catch(e){if(/SESI/.test(e.message)){fail(e);return}err.push(it.label+': '+e.message)}
  const p=document.getElementById('bk-p');if(p)p.textContent=(ok+err.length)+' / '+n}
 await Swal.fire({icon:err.length?'warning':'success',title:ok+' dari '+n+' data dihapus',html:err.length?'<div class="text-left text-sm"><b>Gagal:</b><ul class="list-disc pl-5">'+err.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'',timer:err.length?undefined:1800,showConfirmButton:!!err.length});
 go(S.page)}

function lbWeekData(d){
 const H=d.keu.harian,dm={},W=[],Dw={};d.h.daily.forEach(x=>{dm[x.tanggal]=x});
 H.forEach((x,i)=>{const w=Math.floor(i/7),s=dm[x.tanggal]||{nota:0,qty:0,penjualan:0},o=W[w]||(W[w]={w:w+1,a:i+1,b:i+1,hari:0,nota:0,qty:0,nominal:0,masuk:0,keluar:0});

 W.forEach((o,i)=>{o.g=i&&W[i-1].nominal>0?Math.round((o.nominal-W[i-1].nominal)/W[i-1].nominal*1000)/10:null});
 return {W:W,D:HARI7.map(h=>Dw[h]).filter(Boolean)}}

 const dt=table([['Hari',r=>(best&&r.nama===best.nama?'★ ':'')+r.nama],['Jumlah hari',r=>r.n],['Hari ada penjualan',r=>r.hari],['Nota',r=>r.nota],['Qty',r=>r.qty],['Penjualan',r=>nf(r.nominal)],['Rata² / hari',r=>nf(r.nominal/r.n)]],D);

 return `<div class="mt-4 grid grid-cols-2 gap-3 lg:grid-cols-3 xl:grid-cols-6">${kpi('Penjualan Bruto',rp(T.sub),T.nota+' nota')}${kpi('Diskon / Potongan',rp(T.diskon),pct(T.diskon,T.sub)+'% dari bruto','bg-rose-500')}${kpi('HPP',rp(T.hpp),pct(T.hpp,T.sub)+'% dari bruto','bg-sky-500')}${kpi('Laba Kotor',rp(T.profit),'Margin '+String(pct(T.profit,T.sub)).replace('.',',')+'%','bg-indigo-600')}${kpi('Pengeluaran',rp(T.exp),'Di luar diskon','bg-amber-500')}${kpi('Net Profit',rp(T.net),'Margin '+String(pct(T.net,T.sub)).replace('.',',')+'%',T.net<0?'bg-rose-600':'bg-emerald-600')}</div>

 S.page='harga';const d=await run('plList');S.pl={types:d.types,rows:d.rows,edit:d.edit,dirty:{}};
 const on=d.edit;

 V(`<div class="mb-4 grid gap-3 sm:grid-cols-3">${TILE('GUDANG','Barang',nf(R.length),'Total barang terdaftar',R.length+' jenis')}${TILE('BAHARUN','Harga lengkap',nf(full),'Semua jenis harga terisi',pct(full,R.length)+'%')}${TILE('HBM','Jenis harga',nf(d.types.length),d.types.map(t=>esc(t.name)).join(' · '))}</div><div class="card"><div class="mb-3 flex flex-wrap items-center gap-2"><input id="pq" class="inp max-w-xs" placeholder="Cari kode, nama, ukuran, warna..." oninput="plFlt()"><select id="pk" class="inp max-w-[11rem]" onchange="plFlt()"><option value="">Semua kategori</option>${opts(CATS)}</select>

function plRow(b){const t=S.pl.types;
 return `<tr data-q="${esc((b.kode+' '+b.label+' '+b.kategori).toLowerCase())}" data-k="${esc(b.kategori||'')}"><td class="td">${esc(b.kode)}</td><td class="td">${esc(b.label)}</td><td class="td">${esc(b.kategori)||'-'}</td>
 ${t.map((x,i)=>{const v=b.p[x.key];return `<td class="td text-right ${LOCC.BAHARUN.cell} ${i===0?'border-l-2 '+LOCC.BAHARUN.bd:''}">${S.pl.edit?`<input type="number" min="0" class="inp w-32 text-right" data-k="${esc(b.kode)}" data-t="${esc(x.key)}" value="${v==null?'':v}" oninput="plSet(this)">`:(v==null?'<span class="text-slate-400">-</span>':rp(v))}</td>`}).join('')}</tr>`}

function plMark(){const n=Object.keys(S.pl.dirty).length,b=$('#plsv');if(b)b.disabled=!n;const i=$('#plinfo');if(i&&S.pl.edit)i.innerHTML=n?`<b class="text-amber-600">${n} perubahan belum disimpan</b>`:'Ubah harga langsung di tabel, lalu klik Simpan perubahan. Kolom kosong = belum diisi.'}

function plPaste(){

  plMark();skip=skip.filter(x=>x&&!/^kode/i.test(x));Swal.fire({icon:ok?'success':'warning',title:ok+' baris diterapkan',text:(skip.length?'Kode tidak dikenal: '+skip.slice(0,8).join(', ')+(skip.length>8?'...':'')+'. ':'')+'Klik Simpan perubahan untuk menyimpan.'})})}

  <div class="overflow-x-auto"><table id="hpt" class="min-w-full"><thead>${GRPH(3,[['GUDANG','Komponen biaya',d.types.length],['HBM','Total',1]])}<tr><th class="th">Kategori</th><th class="th">Kode</th><th class="th">Barang</th>${d.types.map((t,i)=>`<th class="th text-right ${LOCC.GUDANG.cell} ${LOCC.GUDANG.tx} ${i===0?'border-l-2 '+LOCC.GUDANG.bd:''}">${esc(t)}</th>`).join('')}<th class="th text-right ${LOCC.HBM.cell} ${LOCC.HBM.tx} border-l-2 ${LOCC.HBM.bd}">Biaya HPP</th></tr></thead>
  <tbody class="divide-y divide-slate-100 dark:divide-slate-700">${d.rows.length?d.rows.map(b=>`<tr data-q="${esc((b.kode+' '+b.label+' '+b.kategori).toLowerCase())}" data-k="${esc(b.kategori||'')}"><td class="td">${esc(b.kategori)||'-'}</td><td class="td">${esc(b.kode)}</td><td class="td">${esc(b.label)}</td>
   ${d.types.map((t,i)=>`<td class="td text-right ${LOCC.GUDANG.cell} ${i===0?'border-l-2 '+LOCC.GUDANG.bd:''}"><input type="number" min="0" class="inp w-28 text-right" data-k="${esc(b.kode)}" data-t="${esc(t)}" value="${b.c[t]==null?'':b.c[t]}" oninput="hpSet(this)"></td>`).join('')}<td class="td text-right font-bold ${LOCC.HBM.cell} ${LOCC.HBM.tx} border-l-2 ${LOCC.HBM.bd}" id="hpt-${esc(b.kode)}">${rp(b.hpp)}</td></tr>`).join(''):`<tr><td class="td text-slate-500" colspan="${4+d.types.length}">Belum ada barang.</td></tr>`}</tbody></table></div></div>`);hpMark()}
function hpFlt(){const q=val('#hq').toLowerCase(),k=val('#hk');document.querySelectorAll('#hpt tbody tr').forEach(r=>r.classList.toggle('hidden',!!((q&&!(r.dataset.q||'').includes(q))||(k&&r.dataset.k!==k))))}
function hpMark(){const n=new Set(Object.keys(S.hp.dirty).map(k=>k.split('\t')[0])).size;$('#hpsv').disabled=!n;
 $('#hpinfo').innerHTML=n?`<b class="text-amber-600">${n} barang belum disimpan</b>`:'Isi komponen biaya per barang; Biaya HPP = jumlah semua komponen. Barang tanpa rincian tetap memakai HPP lama.'}
function hpTot(b){const has=S.hp.types.some(t=>{const k=b.kode+'\t'+t;return k in S.hp.dirty?S.hp.dirty[k]!=null:b.c[t]!=null});
 if(!has)return b.hpp;return S.hp.types.reduce((s,t)=>{const k=b.kode+'\t'+t,v=k in S.hp.dirty?S.hp.dirty[k]:b.c[t];return s+(+v||0)},0)}
function hpPut(el,b,t,v){const key=b.kode+'\t'+t;if(v===b.c[t])delete S.hp.dirty[key];else S.hp.dirty[key]=v;el.classList.toggle('ring-2',key in S.hp.dirty);el.classList.toggle('ring-amber-400',key in S.hp.dirty);
 const c=document.getElementById('hpt-'+b.kode);if(c)c.textContent=rp(hpTot(b))}
function hpSet(el){const b=S.hp.rows.find(x=>x.kode===el.dataset.k);hpPut(el,b,el.dataset.t,el.value===''?null:+el.value);hpMark()}
function hpSave(btn){const g={};Object.keys(S.hp.dirty).forEach(k=>{const a=k.split('\t');(g[a[0]]=g[a[0]]||{})[a[1]]=S.hp.dirty[k]==null?'':S.hp.dirty[k]});
 const items=Object.keys(g).map(k=>({kode:k,c:g[k]}));if(!items.length)return;
 guard(btn,async()=>{const m=await run('hppSet',{items});await okMsg(m);pHpp()})}
function hpPaste(){
 Swal.fire({title:'Tempel dari Excel / Sheets',width:680,html:`<p class="mb-2 text-left text-xs text-slate-500">Kolom pertama <b>Kode</b> (atau nama barang), lalu: ${S.hp.types.map(t=>'<b>'+esc(t)+'</b>').join(' · ')}. Baris judul boleh ikut ditempel. Sel kosong dilewati.</p><textarea id="hpta" class="inp h-48 font-mono text-xs"></textarea>`,showCancelButton:true,confirmButtonText:'Terapkan',cancelButtonText:'Batal',preConfirm:()=>document.getElementById('hpta').value}).then(r=>{if(!r.isConfirmed)return;
  const R=S.hp.rows,byK={},byN={};R.forEach(b=>{byK[b.kode.toUpperCase()]=b;(byN[b.nama.toLowerCase()]=byN[b.nama.toLowerCase()]||[]).push(b)});let ok=0,skip=[];
  String(r.value||'').split(/\r?\n/).forEach(ln=>{if(!ln.trim())return;const c=ln.split('\t'),id=String(c[0]||'').trim(),nm=byN[id.toLowerCase()],b=byK[id.toUpperCase()]||(nm&&nm.length===1?nm[0]:null);if(!b){skip.push(id);return}
   S.hp.types.forEach((t,i)=>{const raw=String(c[i+1]==null?'':c[i+1]).replace(/[^\d]/g,'');if(raw==='')return;const el=[...document.querySelectorAll('#hpt input')].find(x=>x.dataset.k===b.kode&&x.dataset.t===t);if(el){el.value=+raw;hpPut(el,b,t,+raw)}});ok++});
  hpMark();skip=skip.filter(x=>x&&!/^(kode|kategori)/i.test(x));Swal.fire({icon:ok?'success':'warning',title:ok+' baris diterapkan',text:(skip.length?'Tidak dikenal/ganda: '+skip.slice(0,8).join(', ')+'. ':'')+'Klik Simpan perubahan untuk menyimpan.'})})}
function hpTypes(){
 if(Object.keys(S.hp.dirty).length)return Swal.fire({icon:'info',title:'Simpan dulu',text:'Ada perubahan yang belum disimpan. Simpan terlebih dahulu sebelum mengelola komponen.'});
 Swal.fire({title:'Kelola komponen HPP',width:520,showConfirmButton:false,showCloseButton:true,html:`<div class="text-left"><div class="space-y-2">${S.hp.types.map(t=>`<div class="flex items-center justify-between gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm dark:border-slate-700"><span>${esc(t)}</span><span class="flex gap-1"><button class="btn2" data-n="${esc(t)}" onclick="hpTyOp('rename',this.dataset.n)">Ubah nama</button><button class="btn2 text-red-600" data-n="${esc(t)}" onclick="hpTyOp('del',this.dataset.n)">Hapus</button></span></div>`).join('')}</div>
  <div class="mt-4 flex gap-2"><input id="hpnew" class="inp" placeholder="Komponen baru, mis. Ongkir Vendor" maxlength="30"><button class="btn" onclick="hpTyOp('add')">Tambah</button></div></div>`})}
async function hpTyOp(op,old){let name='';
 if(op==='add')name=val('#hpnew');
 else if(op==='rename'){const r=await Swal.fire({title:'Ubah nama',input:'text',inputValue:old,showCancelButton:true,confirmButtonText:'Simpan',cancelButtonText:'Batal'});if(!r.isConfirmed)return hpTypes();name=r.value}
 else{const r=await Swal.fire({icon:'warning',title:'Hapus "'+old+'"?',text:'Nilai komponen ini dihapus dari semua barang dan Biaya HPP dihitung ulang.',showCancelButton:true,confirmButtonText:'Hapus',cancelButtonText:'Batal',confirmButtonColor:'#EF4444'});if(!r.isConfirmed)return hpTypes()}
 Swal.fire({title:'Memproses...',allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 try{const m=await run('hppType',{op,old,name});await pHpp();await okMsg(m)}catch(e){fail(e)}}

function hpMass(){
 const all=[...document.querySelectorAll('#hpt tbody tr')].filter(r=>!r.classList.contains('hidden')&&r.querySelector('input'));
 if(!all.length)return Swal.fire({icon:'info',title:'Tidak ada barang',text:'Tidak ada barang yang tampil. Ubah pencarian/kategori dulu.'});
 const dk=document.documentElement.classList.contains('dark'),st=dk?'style="color:#f1f5f9;background:#1e293b"':'';
 const scope=()=>{const k=document.getElementById('hm-k').value,cs=document.getElementById('hm-c').value.split(/[,\s;]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
  return all.filter(tr=>{const kd=tr.querySelector('input').dataset.k.toUpperCase();return(!k||tr.dataset.k===k)&&(!cs.length||cs.some(c=>kd===c||kd.startsWith(c)))})};
 const cnt=()=>{document.getElementById('hm-n').innerHTML='Berlaku untuk <b>'+scope().length+' barang</b> dari '+all.length+' yang sedang tampil.'};
 Swal.fire({title:'Isi massal',width:520,showCancelButton:true,confirmButtonText:'Terapkan',cancelButtonText:'Batal',
  html:`<div class="space-y-3 text-left"><div id="hm-n" class="rounded-lg bg-teal-50 px-3 py-2 text-xs text-teal-800 dark:bg-teal-950/40 dark:text-teal-200"></div>
  <div class="grid gap-3 sm:grid-cols-2"><div><label class="lbl">Kategori</label><select id="hm-k" class="inp" ${st} onchange="this.dispatchEvent(new Event('hmc',{bubbles:true}))"><option value="">Semua kategori</option>${CATS.map(c=>`<option ${c===val('#hk')?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <div><label class="lbl">Kode (awalan / beberapa, pisah koma)</label><input id="hm-c" class="inp" ${st} placeholder="mis. KTB atau PCI-0001, GMS-0002"></div></div>
  <div><label class="lbl">Komponen</label><select id="hm-t" class="inp" ${st}><option value="*">Semua komponen</option>${S.hp.types.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
  <div><label class="lbl">Cara</label><select id="hm-m" class="inp" ${st}><option value="set">Isi dengan nilai yang sama</option><option value="add">Tambah nominal</option><option value="sub">Kurangi nominal</option><option value="pct">Naikkan / turunkan persen (%)</option><option value="clr">Kosongkan</option></select></div>
  <div><label class="lbl">Nilai</label><input id="hm-v" type="number" class="inp" ${st} placeholder="mis. 3000 atau 10 (untuk %)"></div></div>`,
  didOpen:p=>{cnt();p.querySelector('#hm-k').onchange=cnt;p.querySelector('#hm-c').oninput=cnt},
  preConfirm:()=>{const m=document.getElementById('hm-m').value,v=document.getElementById('hm-v').value;if(m!=='clr'&&v==='')return Swal.showValidationMessage('Isi nilainya');if(!scope().length)return Swal.showValidationMessage('Tidak ada barang yang cocok');return{t:document.getElementById('hm-t').value,m,v:+v,rows:scope()}}
 }).then(r=>{if(!r.isConfirmed)return;const {t,m,v,rows}=r.value;let n=0;
  rows.forEach(tr=>{const b=S.hp.rows.find(x=>x.kode===tr.querySelector('input').dataset.k);
   tr.querySelectorAll('input').forEach(el=>{if(t!=='*'&&el.dataset.t!==t)return;const cur=el.value===''?null:+el.value;let nv;
    if(m==='set')nv=v;else if(m==='clr')nv=null;else if(m==='add')nv=(cur||0)+v;else if(m==='sub')nv=Math.max((cur||0)-v,0);else{if(cur==null)return;nv=cur*(1+v/100)}
    if(nv!=null)nv=Math.max(Math.round(nv),0);el.value=nv==null?'':nv;hpPut(el,b,el.dataset.t,nv);n++})});
  hpMark();Swal.fire({icon:'success',title:rows.length+' barang diperbarui',text:'Periksa hasilnya, lalu klik Simpan perubahan.'})})}
window.__ready=1;
</script>
</body>
